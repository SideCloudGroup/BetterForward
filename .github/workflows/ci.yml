name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
          cache-suffix: "${{ github.workflow }}"

      - name: Show runtime versions
        run: python -c "import sys, sqlite3; print(sys.version); print('SQLite:', sqlite3.sqlite_version)"

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
